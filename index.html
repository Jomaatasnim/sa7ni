<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA7NI</title>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23fff6e5%22/%3E%20%20%20%20%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2218%22%20stroke%3D%22%23ff9411%22%20stroke-width%3D%224%22/%3E%20%20%20%20%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2211.5%22%20fill%3D%22%23ff9411%22/%3E%20%20%20%20%20%20%3Cpath%20d%3D%22M4%206v13c0%203%202%205%205%205s5-2%205-5V6M9%206v52%22%20stroke%3D%22%23ff9411%22%20stroke-width%3D%223.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%20%20%20%20%20%20%3Cpath%20d%3D%22M55%206c-5%204-7%2013-6%2024h6z%22%20fill%3D%22%23ff9411%22/%3E%20%20%20%20%20%20%3Cpath%20d%3D%22M55%2030v28%22%20stroke%3D%22%23ff9411%22%20stroke-width%3D%223.2%22%20stroke-linecap%3D%22round%22/%3E%20%20%20%20%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=17">
</head>

<body class="guest">
  <div class="layout">

    <aside class="side">
      <div class="brand">
        <h1 class="logo">SA7NI</h1>
        <svg class="brand-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"
          aria-label="SA7NI logo" role="img">
          <circle cx="32" cy="32" r="18" stroke="currentColor" stroke-width="4" />
          <circle cx="32" cy="32" r="11.5" fill="currentColor" />
          <path d="M4 6v13c0 3 2 5 5 5s5-2 5-5V6M9 6v52" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M55 6c-5 4-7 13-6 24h6z" fill="currentColor" />
          <path d="M55 30v28" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
        </svg>
      </div>
      <p class="tagline">Ija menna w 4ou9 l benna</p>
      <nav>
        <a href="#home" data-nav="home" data-i18n="nav.home"></a>
        <a href="#favorites" data-nav="favorites" data-i18n="nav.favorites"></a>
        <a href="#add" data-nav="add" data-i18n="nav.add"></a>
        <a href="#profile" data-nav="profile" data-i18n="nav.profile"></a>
      </nav>
      <div data-langs></div>
    </aside>

    <main>
      <!-- HOME -->
      <section id="home" class="view">
        <label class="search"><span>🔍</span><input id="q" type="search" data-i18n-ph="search"></label>
        <div class="chips">
          <button class="chip sel" data-all><span data-i18n="catn.All"></span> 🍽️</button>
          <button class="chip" data-cat="Breakfast"><span data-i18n="catn.Breakfast"></span> 🥞</button>
          <button class="chip" data-cat="Lunch"><span data-i18n="catn.Lunch"></span> 🥪</button>
          <button class="chip" data-cat="Dinner"><span data-i18n="catn.Dinner"></span> 🍝</button>
          <button class="chip" data-cat="Desserts"><span data-i18n="catn.Desserts"></span> 🍰</button>
          <button class="chip" data-cat="Drinks"><span data-i18n="catn.Drinks"></span> 🍹</button>
        </div>
        <h2 class="title" id="popTitle"></h2>
        <div class="grid" id="popular"></div>
      </section>

      <!-- RECIPE -->
      <section id="recipe" class="view">
        <a href="#home" class="back" data-i18n="back"></a>
        <div class="recipe">
          <div class="hero" id="rHero"></div>
          <div>
            <h2 class="rtitle" id="rTitle"></h2>
            <p class="by"><span data-i18n="by"></span> <b id="rBy"></b></p>
            <p class="meta">⭐ <span id="rRate"></span></p>
            <p class="meta">🕒 <span id="rTime"></span></p>
            <p class="meta">👥 <span id="rServ"></span></p>
            <hr>
            <p class="meta" data-i18n="rateThis"></p>
            <div class="stars" id="stars"></div>
            <p class="hint" id="rateMsg"></p>
            <button class="btn fav" id="favBtn"></button>
            <button class="btn edit" id="editBtn" type="button" hidden data-i18n="edit"></button>
            <button class="btn del" id="delBtn" type="button" hidden data-i18n="del"></button>
          </div>
        </div>
        <div class="two">
          <div>
            <h3 class="sub" data-i18n="ingredients"></h3>
            <ul class="ing" id="rIng"></ul>
          </div>
          <div>
            <h3 class="sub" data-i18n="instructions"></h3>
            <ol class="steps" id="rSteps"></ol>
          </div>
        </div>
      </section>

      <!-- FAVORITES -->
      <section id="favorites" class="view">
        <h2 class="title dark" data-i18n="favorites"></h2>
        <label class="search"><span>🔍</span><input id="qf" type="search" data-i18n-ph="search"></label>
        <div class="grid" id="favs"></div>
      </section>

      <!-- PROFILE -->
      <section id="profile" class="view">
        <div class="me">
          <div class="avatar">👩‍🍳</div>
          <div>
            <h2 class="name" id="pName"></h2>
            <p class="bio" data-i18n="bio"></p>
          </div>
        </div>
        <div class="stats">
          <div><b id="recipesCount">0</b><span data-i18n="statRecipes"></span></div>
          <div><b id="savedCount">0</b><span data-i18n="statSaved"></span></div>
          <div><b id="reviewsCount">0</b><span data-i18n="statReviews"></span></div>
        </div>
        <div class="rowhead">
          <h2 class="title dark" data-i18n="myRecipes"></h2><a href="#home" class="all" data-i18n="seeAll"></a>
        </div>
        <div class="grid mini" id="mine"></div>
        <div class="rowhead">
          <h2 class="title dark" data-i18n="savedRecipes"></h2><a href="#favorites" class="all" data-i18n="seeAll"></a>
        </div>
        <div class="grid mini" id="saved"></div>
        <ul class="menu">
          <li id="notifBtn"><em data-i18n="notifications"></em> <span><b id="notifBadge" class="badge" hidden>0</b>›</span></li>
          <li id="dark"><em data-i18n="dark"></em> <span>›</span></li>
          <li id="helpBtn"><em data-i18n="help"></em> <span>›</span></li>
          <li id="adminReset" hidden><em data-i18n="adminReset"></em> <span>›</span></li>
          <li class="out" id="logoutBtn"><em data-i18n="logout"></em> <span>›</span></li>
        </ul>
      </section>

      <!-- ADD -->
      <section id="add" class="view">
        <h2 class="add-title" data-i18n="addRecipe"></h2>
        <div class="form">
          <label class="photo"><span>📷</span><b data-i18n="addPhoto"></b><small data-i18n="tapPhoto"></small><input
              type="file" accept="image/*" hidden></label>
          <div class="fields">
            <label class="lab"><span data-i18n="recipeTitle"></span><input class="in" data-i18n-ph="phTitle"></label>
            <p class="lab" data-i18n="category"></p>
            <div class="chips left">
              <button class="chip" data-cat="Breakfast"><span data-i18n="catn.Breakfast"></span> 🥞</button>
              <button class="chip" data-cat="Lunch"><span data-i18n="catn.Lunch"></span> 🥪</button>
              <button class="chip" data-cat="Dinner"><span data-i18n="catn.Dinner"></span> 🍝</button>
              <button class="chip" data-cat="Desserts"><span data-i18n="catn.Desserts"></span> 🍰</button>
              <button class="chip" data-cat="Drinks"><span data-i18n="catn.Drinks"></span> 🍹</button>
            </div>
            <div class="pair">
              <label class="lab hd"><span data-i18n="prepTime"></span><input class="in" data-i18n-ph="phTime"></label>
              <label class="lab hd"><span data-i18n="servings"></span><input class="in" data-i18n-ph="phServ"></label>
            </div>
          </div>
          <div>
            <div class="rowhead">
              <h3 class="sub hd" data-i18n="ingredients"></h3><button class="plus" data-add="ing" data-i18n="addIng"></button>
            </div>
            <div id="ing"></div>
          </div>
          <div>
            <div class="rowhead">
              <h3 class="sub hd" data-i18n="instructions"></h3><button class="plus" data-add="step" data-i18n="addStep"></button>
            </div>
            <div id="step"></div>
          </div>
        </div>
        <p class="err" id="addErr" role="alert"></p>
        <div class="actions">
          <button class="btn cancel" id="cancelAdd" type="button" data-i18n="cancel"></button>
          <button class="btn publish" type="button" data-i18n="publish"></button>
        </div>
      </section>
    </main>
  </div>

  <!-- LOGIN / SIGN UP (visible seulement si personne n'est connecté) -->
  <section id="auth">
    <form class="auth-card" id="authForm" novalidate>
      <svg class="brand-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="SA7NI logo"
        role="img">
        <circle cx="32" cy="32" r="18" stroke="currentColor" stroke-width="4" />
        <circle cx="32" cy="32" r="11.5" fill="currentColor" />
        <path d="M4 6v13c0 3 2 5 5 5s5-2 5-5V6M9 6v52" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"
          stroke-linejoin="round" />
        <path d="M55 6c-5 4-7 13-6 24h6z" fill="currentColor" />
        <path d="M55 30v28" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
      </svg>
      <h1 class="logo">SA7NI</h1>
      <p class="tagline">Ija menna w 4ou9 l benna</p>
      <div class="tabs">
        <button type="button" class="tab sel" data-mode="login" data-i18n="login"></button>
        <button type="button" class="tab" data-mode="signup" data-i18n="signup"></button>
      </div>
      <label class="lab" id="nameRow" hidden><span data-i18n="name"></span><input class="in" id="aName"
          autocomplete="name" data-i18n-ph="phName"></label>
      <label class="lab"><span data-i18n="email"></span><input class="in" id="aEmail" type="email"
          autocomplete="email" placeholder="you@example.com"></label>
      <label class="lab"><span data-i18n="password"></span><input class="in" id="aPw" type="password"
          autocomplete="current-password" data-i18n-ph="phPw"></label>
      <p class="err" id="aErr" role="alert"></p>
      <button class="btn" id="aGo" type="submit" data-i18n="login"></button>
      <div data-langs></div>
    </form>
  </section>

  <!-- NOTIFICATIONS -->
  <dialog id="notifDlg" class="dlg">
    <div class="dlg-in">
      <div class="dlg-head">
        <h2 data-i18n="notifTitle"></h2><button class="x" data-close aria-label="Close">✕</button>
      </div>
      <ul class="nlist" id="nList"></ul>
      <div class="dlg-foot"><button class="btn cancel" id="nClear" type="button" data-i18n="clearAll"></button></div>
    </div>
  </dialog>

  <!-- HELP & SUPPORT -->
  <dialog id="helpDlg" class="dlg">
    <div class="dlg-in">
      <div class="dlg-head">
        <h2 data-i18n="helpTitle"></h2><button class="x" data-close aria-label="Close">✕</button>
      </div>
      <details>
        <summary data-i18n="q1"></summary>
        <p data-i18n="a1"></p>
      </details>
      <details>
        <summary data-i18n="q2"></summary>
        <p data-i18n="a2"></p>
      </details>
      <details>
        <summary data-i18n="q3"></summary>
        <p data-i18n="a3"></p>
      </details>
      <details>
        <summary data-i18n="q4"></summary>
        <p data-i18n="a4"></p>
      </details>
      <p class="lab" style="margin-top:18px" data-i18n="stillHelp"></p>
      <textarea id="helpMsg" class="in area" data-i18n-ph="phHelp"></textarea>
      <p class="err" id="helpErr" role="alert"></p>
      <button class="btn" id="helpSend" type="button" data-i18n="send"></button>
    </div>
  </dialog>

  <script src="i18n.js?v=17"></script>
  <script src="recipes-i18n.js?v=17"></script>
  <script src="auth.js?v=17"></script>
</body>

</html>
